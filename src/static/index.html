<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="branch-bg" aria-hidden="true">
      <svg class="branch-lines" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
        <path class="branch" d="M20 80 C 180 80, 180 220, 360 220 S 620 220, 820 120 S 1040 40, 1180 90" />
        <path class="branch delay-1" d="M40 260 C 220 260, 240 140, 420 160 S 680 240, 860 300 S 1040 360, 1180 280" />
        <path class="branch delay-2" d="M10 480 C 160 470, 220 620, 400 600 S 640 520, 860 560 S 1060 640, 1190 520" />
        <path class="branch delay-3" d="M80 700 C 240 690, 280 540, 460 560 S 720 680, 920 640 S 1080 560, 1180 620" />
        <circle class="commit" cx="20" cy="80" r="7" />
        <circle class="commit" cx="360" cy="220" r="7" />
        <circle class="commit" cx="820" cy="120" r="7" />
        <circle class="commit" cx="420" cy="160" r="6" />
        <circle class="commit" cx="860" cy="300" r="7" />
        <circle class="commit" cx="400" cy="600" r="7" />
        <circle class="commit" cx="860" cy="560" r="6" />
        <circle class="commit" cx="460" cy="560" r="7" />
        <circle class="commit" cx="920" cy="640" r="6" />
      </svg>
    </div>

    <header>
      <div class="brand">
        <img
          class="mascot"
          src="https://octodex.github.com/images/original.png"
          alt="Mergington mascot, the original Octocat"
        />
        <div>
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
      </div>
      <div class="account">
        <button id="account-btn" type="button" aria-expanded="false" aria-controls="account-menu">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c1.5-3.5 4.2-5 8-5s6.5 1.5 8 5"></path>
          </svg>
          <span class="account-label">Account</span>
        </button>
        <div id="account-menu" class="account-menu hidden">
          <p id="account-status">Students can browse activities.</p>
          <button id="login-open" type="button">Log in</button>
          <button id="logout-btn" type="button" class="hidden">Log out</button>
        </div>
      </div>
    </header>

    <div class="mascot-row" aria-label="School mascots">
      <img src="https://octodex.github.com/images/Professortocat_v2.png" alt="Professor Octocat mascot" />
      <img src="https://octodex.github.com/images/collabocats.jpg" alt="Collabocats mascot" />
      <img src="https://octodex.github.com/images/supportcat.png" alt="Supportcat mascot" />
      <img src="https://octodex.github.com/images/jetpacktocat.png" alt="Jetpacktocat mascot" />
      <img src="https://octodex.github.com/images/minion.png" alt="Minion Octocat mascot" />
      <img src="https://octodex.github.com/images/octobiwan.jpg" alt="Octobiwan mascot" />
    </div>

    <div class="toolbar" role="search">
      <label class="toolbar-field">
        Search
        <input id="search" type="search" placeholder="Name, description, or schedule" />
      </label>
      <label class="toolbar-field">
        Category
        <select id="category-filter">
          <option value="">All categories</option>
        </select>
      </label>
      <label class="toolbar-field">
        Sort
        <select id="sort">
          <option value="name">Name</option>
          <option value="time">Time</option>
        </select>
      </label>
    </div>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <p>Loading activities...</p>
        </div>
      </section>
    </main>

    <div id="message" class="message hidden" role="status"></div>

    <dialog id="login-dialog">
      <form id="login-form">
        <h3>Teacher login</h3>
        <p>Only teachers can register or unregister students.</p>
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <div class="dialog-actions">
          <button type="submit">Log in</button>
          <button id="login-cancel" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <dialog id="register-dialog">
      <form id="register-form">
        <h3>Register student</h3>
        <p id="register-activity-label"></p>
        <div class="form-group">
          <label for="email">Student email</label>
          <input id="email" type="email" required placeholder="student@mergington.edu" />
        </div>
        <div class="dialog-actions">
          <button type="submit">Register student</button>
          <button id="register-cancel" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
