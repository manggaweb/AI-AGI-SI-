# Automated translation with DeepL (format: JSON, source: en, targets: zh-CN, ja, fr, de).
#
# Required GitHub Secrets (Settings > Secrets and variables > Actions):
#   DEEPL_API_KEY  - your DeepL API key (keys ending in ":fx" use the free API endpoint)
name: Translate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["locales/en.json"]
  pull_request:
    paths: ["locales/en.json"]

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Translate
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          SOURCE_LANG: en
          TARGET_LANGS: zh-CN,ja,fr,de
        run: python scripts/translate.py
      - name: Commit translations
        # Fork PRs have no write token or secrets, so only commit for same-repo events
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add locales
          git diff --cached --quiet || (git commit -m "chore: update translations" && git push)
